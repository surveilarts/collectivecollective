<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VR Cocoon Art Gallery</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(circle at 20% 20%, #1a1a2f, #0b0b14);
      }
      #overlay {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(15, 15, 25, 0.7);
        color: #e3e6ff;
        padding: 12px 16px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        max-width: 320px;
        line-height: 1.4;
        letter-spacing: 0.2px;
        border: 1px solid rgba(126, 169, 255, 0.25);
      }
      #overlay h1 {
        margin: 0 0 8px;
        font-size: 20px;
        color: #9df0ff;
        text-transform: uppercase;
        letter-spacing: 1.2px;
      }
      #overlay p {
        margin: 0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>Cocoon Chamber</h1>
      <p>
        Float through luminous silk pods and drift nets. Use WASD or arrow keys to
        glide; drag to look around. Each cocoon hums with color mapped to a
        different piece of generative art.
      </p>
    </div>

    <a-scene background="color: #0b0b14">
      <!-- Ambient glow and guiding lights -->
      <a-entity light="type: ambient; color: #a0c3ff; intensity: 0.35"></a-entity>
      <a-entity light="type: point; color: #ff7ee2; intensity: 1.2; distance: 18" position="0 2 -2"></a-entity>
      <a-entity light="type: point; color: #80ffd1; intensity: 0.8; distance: 18" position="4 2 2"></a-entity>
      <a-entity light="type: point; color: #a19bff; intensity: 0.9; distance: 18" position="-4 2 2"></a-entity>

      <!-- Horizon ring -->
      <a-torus position="0 0 0" radius="12" radius-tubular="0.08" rotation="90 0 0" color="#152647" material="opacity: 0.6; transparent: true"></a-torus>
      <a-torus position="0 0 -1" radius="9" radius-tubular="0.05" rotation="90 0 0" color="#1f3b75" material="opacity: 0.4; transparent: true"></a-torus>

      <!-- Water-like ground sheen -->
      <a-plane position="0 -0.01 0" rotation="-90 0 0" width="40" height="40" material="color: #0d1428; roughness: 0.3; metalness: 0.8; opacity: 0.7; transparent: true"></a-plane>

      <!-- Floating cocoons -->
      <a-entity id="cocoon-ring" position="0 1.2 -3" animation="property: rotation; to: 0 360 0; loop: true; dur: 32000; easing: linear">
        <a-entity position="-3 0 0" geometry="primitive: sphere; radius: 0.8; segmentsWidth: 32; segmentsHeight: 24" material="color: #ff8ad6; metalness: 0.1; roughness: 0.2; opacity: 0.85; transparent: true; envMapIntensity: 1" animation__pulse="property: scale; dir: alternate; dur: 2400; loop: true; to: 1.1 1.2 1.1"></a-entity>
        <a-entity position="-1.2 0.6 -2" geometry="primitive: sphere; radius: 0.6" material="color: #9df0ff; opacity: 0.7; metalness: 0.2; roughness: 0.1; transparent: true" animation__pulse="property: scale; dir: alternate; dur: 1800; loop: true; to: 1.1 1.1 1.1"></a-entity>
        <a-entity position="1 0.4 -1.5" geometry="primitive: sphere; radius: 0.65" material="color: #a3ffcb; opacity: 0.75; metalness: 0.15; roughness: 0.15; transparent: true" animation__pulse="property: position; dir: alternate; dur: 2200; loop: true; to: 1 0.8 -1.4"></a-entity>
        <a-entity position="2.8 -0.2 0.5" geometry="primitive: sphere; radius: 0.9" material="color: #c8b5ff; opacity: 0.82; metalness: 0.12; roughness: 0.25; transparent: true" animation__pulse="property: scale; dir: alternate; dur: 2600; loop: true; to: 1.05 1.15 1.05"></a-entity>
        <a-entity position="0 0.8 1.8" geometry="primitive: sphere; radius: 0.7" material="color: #ffcf9a; opacity: 0.7; metalness: 0.22; roughness: 0.2; transparent: true" animation__drift="property: position; dir: alternate; dur: 3000; loop: true; to: 0 1.05 2.1"></a-entity>
      </a-entity>

      <!-- Vertical silk columns -->
      <a-cylinder position="-5 1.5 -1" radius="0.08" height="3.5" material="color: #4fb4ff; opacity: 0.5; transparent: true" animation="property: rotation; to: 0 0 360; loop: true; dur: 18000; easing: linear"></a-cylinder>
      <a-cylinder position="5 1.5 1" radius="0.08" height="3.5" material="color: #ff7ee2; opacity: 0.5; transparent: true" animation="property: rotation; to: 0 0 -360; loop: true; dur: 18000; easing: linear"></a-cylinder>

      <!-- Hanging strands -->
      <a-entity position="0 2.8 -2" animation="property: rotation; to: 0 -360 0; loop: true; dur: 24000; easing: linear">
        <a-torus-knot radius="0.35" radius-tubular="0.06" p="2" q="5" color="#9df0ff" material="opacity: 0.65; transparent: true; metalness: 0.2"></a-torus-knot>
      </a-entity>
      <a-entity position="-1.5 2.5 1" animation="property: rotation; to: 0 360 0; loop: true; dur: 18000; easing: linear">
        <a-torus-knot radius="0.25" radius-tubular="0.05" p="3" q="4" color="#ffcf9a" material="opacity: 0.65; transparent: true; metalness: 0.2"></a-torus-knot>
      </a-entity>

      <!-- Info pylons -->
      <a-cylinder position="-2 0.5 3" radius="0.15" height="1" material="color: #1d2f55; opacity: 0.8; metalness: 0.6"></a-cylinder>
      <a-text value="Serum Silk" color="#e6efff" align="center" position="-2 1.2 3" rotation="0 180 0" width="2.5" shader="msdf" negate="false"></a-text>

      <a-cylinder position="2 0.5 3" radius="0.15" height="1" material="color: #1d2f55; opacity: 0.8; metalness: 0.6"></a-cylinder>
      <a-text value="Aurora Weave" color="#e6efff" align="center" position="2 1.2 3" rotation="0 180 0" width="2.5" shader="msdf" negate="false"></a-text>

      <!-- Camera / controls -->
      <a-entity camera position="0 1.6 6" wasd-controls look-controls>
        <a-entity cursor="fuse: false" raycaster="objects: .clickable" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015" material="color: #9df0ff; shader: flat"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
